<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>方块突围 · V6.4 饥饿值危机</title>
  <link rel="stylesheet" href="action/style.css?v=6.4">

</head>
<body>
<main id="game">
  <header class="battle-header">
    <div class="command-row">
      <div class="stage"><b id="stage"></b><small id="time"></small><span id="stageDots" hidden></span></div>
      <div class="tools">
        <button id="upgrade" hidden>强化</button><button id="craft">工作台</button><button id="pause" aria-label="暂停">暂停</button>
        <button id="sfx" hidden>音效 开</button><button id="music" hidden>音乐 开</button><b id="stats" hidden></b>
      </div>
    </div>
    <div id="bossHud"><b id="bossName"></b><div class="bar"><i id="bossHp"></i></div></div>
    <div id="toast" role="status"></div>
  </header>
  <div class="arena-frame"><canvas id="arena" tabindex="-1" aria-label="方块突围游戏战场"></canvas></div>
  <footer class="battle-footer">
    <div id="tutorial"><span id="tip"></span><button id="skip">跳过引导</button></div>
    <div class="vitals">
      <div class="health"><b>生命 <span id="hpText"></span></b><div id="hearts" aria-hidden="true"></div><div class="bar"><i id="hp"></i></div></div>
      <div class="hunger"><b id="hungerText"></b><div id="hunger6" aria-hidden="true"></div></div>
    </div>
    <div class="inventory-row">
      <div class="hotbar" aria-label="食物库存"></div>
      <div class="progress"><span id="level"></span><div class="bar xp"><i id="xp"></i></div></div>
      <div class="dash"><span id="dashText"></span><div class="bar"><i id="dash"></i></div></div>
    </div>
  </footer>
  <div id="touch" aria-label="触屏操作">
    <div id="stick" aria-label="拖动摇杆移动"><i id="knob"></i></div>
    <div class="touch-actions"><button id="fire" aria-label="按住攻击"><span>攻击</span><small>按住连射</small></button><button id="dashButton">冲刺</button></div>
  </div>
  <div id="combo" hidden></div>
  <section id="overlay" aria-label="游戏面板"></section>
</main>
<script defer src="action/asset-list.js?v=6.4"></script>
<script defer src="action/assets.js?v=6.4"></script>
<script defer src="action/audio.js?v=6.4"></script>
<script defer src="action/framework.js?v=6.4"></script>
<script defer src="action/food-knowledge.js?v=6.4"></script>
<script defer src="action/nutrition-data.js?v=6.4"></script>
<script defer src="action/game.js?v=6.4"></script>
<script defer src="action/render.js?v=6.4"></script>
<script defer src="action/ui.js?v=6.4"></script>
<script defer src="action/mc-render.js?v=6.4"></script>
<script defer src="action/nutrition.js?v=6.4"></script>
<script defer src="action/v6.js?v=6.4"></script>
<script defer src="action/presentation.js?v=6.4"></script>
</body>
</html>
