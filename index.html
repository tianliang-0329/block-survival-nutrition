<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#192820">
 <title>合理膳食 · 游戏大厅</title>
 <link rel="stylesheet" href="./hall.css?v=1">
</head>
<body>
 <main class="hall">
  <header>
   <h1>合理膳食 <span>游戏大厅</span></h1>
   <p>选一款游戏，开始你的补给冒险。</p>
  </header>
  <nav class="games" aria-label="选择游戏">
   <a class="game survival" href="./action-demo.html">
    <div class="cover" aria-hidden="true">
     <img src="./assets/minecraft/bow.png" alt="" class="cover-icon" width="80" height="80">
     <img src="./assets/minecraft/apple.png" alt="" class="cover-detail" width="36" height="36">
    </div>
    <div class="info">
     <span class="format">即时动作 · 手机横屏</span>
     <h2>方块突围</h2>
     <p>边移动边拉弓，收集食材，搭配餐盘破开首领护盾。</p>
     <strong>开始突围 <span aria-hidden="true">→</span></strong>
    </div>
   </a>
   <a class="game canteen" href="./games/card/index.html">
    <div class="cover" aria-hidden="true">
     <span class="food-card"><img src="./games/card/assets/bread.png" alt="" width="39" height="39"></span>
     <span class="food-card"><img src="./games/card/assets/carrot.png" alt="" width="45" height="45"></span>
     <span class="food-card"><img src="./games/card/assets/cooked_salmon.png" alt="" width="39" height="39"></span>
    </div>
    <div class="info">
     <span class="format">回合制 · 膳食卡牌</span>
     <h2>方块食堂</h2>
     <p>规划每回合的出牌顺序，用食材组合自动合成配方。</p>
     <strong>进入食堂 <span aria-hidden="true">→</span></strong>
    </div>
   </a>
  </nav>
  <p class="mobile-note">《方块突围》在手机上自动按横向显示，锁定竖屏也可以玩。</p>
 </main>
</body>
</html>
